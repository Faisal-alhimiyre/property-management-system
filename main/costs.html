<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";document.documentElement.setAttribute("lang",l==="en"?"en":"ar");document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.costsTitle"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/navstyle.css" />
  <link rel="stylesheet" href="../css/costs.css" />
  <script src="../js/main/walajna-i18n.js"></script>
</head>
<body data-nav="user" data-wl-bc="costs">
  <div id="navbar-container"></div>

  <main class="pay-wrap">
    <div class="pay-header">
      <div>
        <h2 id="pageTitle" data-i18n="costs.pageTitle"></h2>
        <p id="pageSub"></p>
      </div>

      <div class="pay-search">
        <input id="searchInput" type="text" data-i18n-placeholder="costs.searchPh" placeholder="" />
      </div>
    </div>

    <div class="costs-topbar">
      <div id="costsCount" class="count-label"></div>
      <button id="openCostModalBtn" class="record-btn" type="button" data-i18n="costs.recordBtn"></button>
    </div>

    <div id="costsSummary" class="pay-summary"></div>

    <div id="costsTableContainer" class="costs-table-wrap"></div>
  </main>

  <div id="recordCostModal" class="wl-modal" aria-hidden="true">
    <div class="wl-modal__backdrop" data-record-cost-close="true"></div>

    <div class="wl-modal__panel" role="dialog" aria-modal="true" aria-labelledby="recordCostModalTitle">
      <div class="wl-modal__header">
        <div>
          <h3 id="recordCostModalTitle" class="wl-modal__title" data-i18n="costs.modalTitle"></h3>
          <p class="wl-modal__subtitle" data-i18n="costs.modalSub"></p>
        </div>

        <button id="closeRecordCostModal" class="wl-icon-btn" type="button" data-i18n-aria-label="common.close" aria-label="">✕</button>
      </div>

      <div class="wl-modal__body">
        <div id="selectedCostInfo" class="payments-inline-note">—</div>

        <div class="payments-form-grid">
          <div class="payments-field">
            <label for="costTypeInput" data-i18n="costs.th.type"></label>
            <select id="costTypeInput">
              <option value="" data-i18n-label="costs.pick"></option>
              <option value="maintenance" data-i18n-label="costs.type.maintenance"></option>
              <option value="repair" data-i18n-label="costs.type.repair"></option>
              <option value="discount" data-i18n-label="costs.type.discount"></option>
              <option value="adjustment" data-i18n-label="costs.type.adjustment"></option>
              <option value="service" data-i18n-label="costs.type.service"></option>
              <option value="replacement" data-i18n-label="costs.type.replacement"></option>
              <option value="cleaning" data-i18n-label="costs.type.cleaning"></option>
              <option value="other" data-i18n-label="costs.type.other"></option>
            </select>
          </div>

          <div class="payments-field">
            <label for="costAmountInput" data-i18n="costs.th.amount"></label>
            <input id="costAmountInput" type="number" min="0" step="0.01" />
          </div>

          <div class="payments-field">
            <label for="costStatusInput" data-i18n="costs.th.status"></label>
            <select id="costStatusInput">
              <option value="approved" data-i18n-label="costs.st.approved"></option>
              <option value="pending" data-i18n-label="costs.st.pending"></option>
              <option value="cancelled" data-i18n-label="costs.st.cancelled"></option>
            </select>
          </div>

          <div class="payments-field">
            <label for="costDateInput" data-i18n="costs.dateLabel"></label>
            <input id="costDateInput" type="date" />
          </div>

          <div class="payments-field" style="grid-column:1/-1;">
            <label for="costNotesInput" data-i18n="costs.th.notes"></label>
            <textarea id="costNotesInput" data-i18n-placeholder="payments.notesPh" placeholder=""></textarea>
          </div>
        </div>
      </div>

      <div class="wl-modal__footer">
        <button id="saveCostBtn" class="wl-btn wl-btn--primary" type="button" data-i18n="costs.saveExpense"></button>
        <button id="cancelRecordCostModal" class="wl-btn wl-btn--ghost" type="button" data-i18n="common.cancel"></button>
      </div>
    </div>
  </div>

  <script src="../js/main/theme.js"></script>
  <script src="../js/main/breadcrumbs.js"></script>
  <script src="../js/main/global-back.js"></script>
  <script src="../js/main/nav.js"></script>
  <script src="../js/apartment-manager/apartment-storage.js"></script>
  <script src="../js/apartment-manager/apartment-costs.js"></script>
</body>
</html>
