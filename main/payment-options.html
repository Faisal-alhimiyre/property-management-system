<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.paymentOptionsTitle"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/navstyle.css" />
  <link rel="stylesheet" href="../css/payment-options.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
  <script src="../js/main/walajna-dialog.js"></script>
</head>
<body data-nav="user" data-wl-bc="payment-options">
  <div id="navbar-container"></div>

  <main class="payment-options-wrap">
    <section class="payment-options-header">
      <div class="payment-options-header__content">
        <h2 data-i18n="paymentOpt.title"></h2>
        <p data-i18n="paymentOpt.subtitle"></p>
        <a id="backToPaymentsLink" class="back-link" href="#" data-i18n="paymentOpt.back"></a>
      </div>
    </section>

    <section id="paymentSummaryBox" class="payment-summary-box" data-i18n="paymentOpt.loading"></section>

    <section class="payment-methods-grid">
      <div class="payment-method-card tamara" data-method="tamara">
        <div class="payment-method-head">
          <span class="payment-method-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="tamaraBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#C084FC"/>
                  <stop offset="1" stop-color="#7C3AED"/>
                </linearGradient>
              </defs>
              <rect width="48" height="48" rx="12" fill="url(#tamaraBg)"/>
              <text x="24" y="30" text-anchor="middle" fill="#fff" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" font-weight="700">tamara</text>
            </svg>
          </span>
          <h3>Tamara</h3>
        </div>
        <p data-i18n="paymentOpt.tamaraDesc"></p>
      </div>

      <div class="payment-method-card tabby" data-method="tabby">
        <div class="payment-method-head">
          <span class="payment-method-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <rect width="48" height="48" rx="12" fill="#21D789"/>
              <text x="24" y="30" text-anchor="middle" fill="#0F172A" font-family="Segoe UI, Tahoma, sans-serif" font-size="13" font-weight="800">tabby</text>
            </svg>
          </span>
          <h3>Tabby</h3>
        </div>
        <p data-i18n="paymentOpt.tabbyDesc"></p>
      </div>

      <div class="payment-method-card apple-pay" data-method="apple_pay">
        <div class="payment-method-head">
          <img
            src="../images/payment/apple-pay.png"
            alt="Apple Pay"
            class="payment-method-icon payment-method-icon--apple-pay"
            width="48"
            height="48"
          />
          <h3>Apple Pay</h3>
        </div>
        <p data-i18n="paymentOpt.appleDesc"></p>
      </div>

      <div class="payment-method-card bank-card" data-method="card">
        <div class="payment-method-head">
          <span class="payment-method-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <rect width="48" height="48" rx="12" fill="#FFF7ED"/>
              <rect x="7" y="13" width="34" height="22" rx="5" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
              <rect x="11" y="17" width="12" height="9" rx="2" fill="#FB923C"/>
              <rect x="11" y="29" width="14" height="2" rx="1" fill="#C2410C"/>
              <rect x="28" y="29" width="9" height="2" rx="1" fill="#F97316"/>
            </svg>
          </span>
          <h3 data-i18n="paymentOpt.cardTitle"></h3>
        </div>
        <p data-i18n="paymentOpt.cardDesc"></p>
      </div>
    </section>
  </main>

  <script src="../js/main/theme.js"></script>
  <script src="../js/main/breadcrumbs.js"></script>
  <script src="../js/main/auth.js"></script>
  <script src="../js/main/nav.js"></script>
  <script src="../js/main/payments-api.js"></script>
  <script src="../js/main/payment-options-page.js"></script>
</body>
</html>
