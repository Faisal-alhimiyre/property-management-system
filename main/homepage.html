<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";document.documentElement.setAttribute("lang",l==="en"?"en":"ar");document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.homepage"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/homepage.css" />
  <script src="../js/main/walajna-i18n.js"></script>
</head>

<body data-nav="guest" data-global-back="false">

  <div id="navbar-container"></div>

  <main id="home" class="hero">
    <div class="hero__content">
      <div class="badge" data-i18n="home.badge"></div>

      <h1 class="hero__title">
        <span data-i18n="home.heroTitle1"></span> <br />
        <span class="accent" data-i18n="home.heroAccent"></span>
      </h1>

      <p class="hero__subtitle" data-i18n="home.heroSub"></p>

      <div class="hero__buttons">
        <a href="../auth/login.html" class="btn btn--primary btn--lg" data-i18n="home.ctaStart"></a>
        <a href="#features" class="btn btn--ghost btn--lg" data-i18n="home.ctaMore"></a>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat__value">50K+</div>
          <div class="stat__label" data-i18n="home.statUsers"></div>
        </div>
        <div class="stat">
          <div class="stat__value">4.9★</div>
          <div class="stat__label" data-i18n="home.statRating"></div>
        </div>
        <div class="stat">
          <div class="stat__value">99%</div>
          <div class="stat__label" data-i18n="home.statAccuracy"></div>
        </div>
      </div>
    </div>

    <div class="hero__visual">
      <img src="../pics/bulding-removebg-preview (1).png (1).png" data-i18n-alt="home.heroImgAlt" alt="" class="hero__image" />
    </div>

    <div class="wave" aria-hidden="true">
      <svg viewBox="0 0 1440 120" preserveAspectRatio="none">
        <path d="M0,64 C240,128 480,0 720,48 C960,96 1200,64 1440,16 L1440,120 L0,120 Z"></path>
      </svg>
    </div>
  </main>

  <section id="features" class="section">
    <h2 class="section__title" data-i18n="home.featuresTitle"></h2>

    <div class="cards">
      <div class="card">
        <h3 data-i18n="home.f1t"></h3>
        <p data-i18n="home.f1d"></p>
      </div>

      <div class="card">
        <h3 data-i18n="home.f2t"></h3>
        <p data-i18n="home.f2d"></p>
      </div>

      <div class="card">
        <h3 data-i18n="home.f3t"></h3>
        <p data-i18n="home.f3d"></p>
      </div>
    </div>
  </section>

  <section id="how" class="section">
    <h2 class="section__title" data-i18n="home.howTitle"></h2>

    <div class="cards">
      <div class="card">
        <h3 data-i18n="home.h1t"></h3>
        <p data-i18n="home.h1d"></p>
      </div>

      <div class="card">
        <h3 data-i18n="home.h2t"></h3>
        <p data-i18n="home.h2d"></p>
      </div>

      <div class="card">
        <h3 data-i18n="home.h3t"></h3>
        <p data-i18n="home.h3d"></p>
      </div>
    </div>
  </section>

  <section id="contact" class="section">
    <h2 class="section__title" data-i18n="home.contactTitle"></h2>
    <p class="muted" data-i18n="home.contactSoon"></p>
  </section>

  <footer class="footer">
    <p id="footerText"></p>
    <a class="to-top" href="#top" data-i18n="home.toTop"></a>
  </footer>

  <script>
    function setHomeFooter() {
      var el = document.getElementById("footerText");
      if (el && window.walajna_language) {
        el.textContent = walajna_language.t("home.footer", {
          year: new Date().getFullYear()
        });
      }
    }
    document.addEventListener("DOMContentLoaded", setHomeFooter);
    document.addEventListener("walajna:i18n-applied", setHomeFooter);
  </script>
  <script src="../js/main/theme.js"></script>
  <script src="../js/main/nav.js"></script>
</body>
</html>
