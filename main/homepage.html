<!DOCTYPE html>
<html lang="ar" dir="rtl" id="top">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.homepage"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/navstyle.css" />
  <link rel="stylesheet" href="../css/homepage.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
</head>

<body data-nav-adaptive="true" data-global-back="false">
  <script>
    (function () {
      try {
        var logged = !!(
          sessionStorage.getItem("walajna_current_user") ||
          localStorage.getItem("walajna_current_user") ||
          localStorage.getItem("access_token")
        );
        document.body.setAttribute("data-nav", logged ? "user" : "guest");
      } catch (e) {
        document.body.setAttribute("data-nav", "guest");
      }
    })();
  </script>

  <div id="navbar-container"></div>

  <div class="home-surface">
    <main id="home" class="hero hero--catchy">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__mesh"></div>
        <div class="hero__orb hero__orb--1"></div>
        <div class="hero__orb hero__orb--2"></div>
      </div>

      <div class="hero__inner">
        <div class="hero__content">
          <div class="badge badge--pulse" data-i18n="home.badge"></div>

          <h1 class="hero__title">
            <span class="hero__title-line" data-i18n="home.heroTitle1"></span>
            <span class="hero__title-line hero__title-line--accent" data-i18n="home.heroAccent"></span>
          </h1>

          <p class="hero__subtitle" data-i18n="home.heroSub"></p>

          <div class="hero__buttons">
            <a href="../auth/login.html" class="btn btn--primary btn--lg btn--pop" data-i18n="home.ctaStart"></a>
            <a href="#features" class="btn btn--ghost btn--lg btn--outline-pop" data-i18n="home.ctaMore"></a>
          </div>
        </div>

        <div class="hero__showcase">
          <figure class="hero-art" data-i18n-aria-label="home.heroImgAlt" aria-label="">
            <div class="hero-art__stage" aria-hidden="true">
              <div class="hero-art__aurora"></div>
              <svg class="hero-art__svg" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
                <defs>
                  <linearGradient id="haTower" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0%" stop-color="#0b1220"/>
                    <stop offset="100%" stop-color="#1a3352"/>
                  </linearGradient>
                  <linearGradient id="haWin" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#5ee7f7"/>
                    <stop offset="100%" stop-color="#1fb8d4"/>
                  </linearGradient>
                  <linearGradient id="haGround" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#1a2f4a"/>
                    <stop offset="100%" stop-color="#0f172a"/>
                  </linearGradient>
                </defs>
                <!-- Distant skyline haze -->
                <path d="M0 142 L46 128 L88 136 L130 118 L176 124 L220 108 L268 120 L312 112 L358 122 L400 108 L420 115 L420 200 L0 200 Z" fill="#1a2f4a" opacity="0.08"/>
                <!-- Left tower -->
                <rect x="20" y="86" width="56" height="86" rx="6" fill="url(#haTower)"/>
                <g fill="url(#haWin)" opacity="0.35">
                  <rect x="28" y="96" width="10" height="8" rx="1"/>
                  <rect x="42" y="96" width="10" height="8" rx="1"/>
                  <rect x="28" y="110" width="10" height="8" rx="1"/>
                  <rect x="42" y="110" width="10" height="8" rx="1"/>
                  <rect x="28" y="124" width="10" height="8" rx="1"/>
                  <rect x="42" y="124" width="10" height="8" rx="1"/>
                </g>
                <!-- Hero tower (center) -->
                <polygon points="96,52 144,24 192,52" fill="#152a42"/>
                <rect x="96" y="52" width="96" height="120" rx="10" fill="url(#haTower)"/>
                <g class="hero-art__twinkle" fill="url(#haWin)">
                  <rect class="hero-art__twinkle-el" x="108" y="62" width="11" height="9" rx="1.5" opacity="0.9"/>
                  <rect class="hero-art__twinkle-el" x="124" y="62" width="11" height="9" rx="1.5" opacity="0.75"/>
                  <rect class="hero-art__twinkle-el" x="140" y="62" width="11" height="9" rx="1.5" opacity="0.85"/>
                  <rect class="hero-art__twinkle-el" x="156" y="62" width="11" height="9" rx="1.5" opacity="0.7"/>
                  <rect class="hero-art__twinkle-el" x="172" y="62" width="11" height="9" rx="1.5" opacity="0.8"/>
                  <rect class="hero-art__twinkle-el" x="108" y="78" width="11" height="9" rx="1.5" opacity="0.65"/>
                  <rect class="hero-art__twinkle-el" x="124" y="78" width="11" height="9" rx="1.5" opacity="0.95"/>
                  <rect class="hero-art__twinkle-el" x="140" y="78" width="11" height="9" rx="1.5" opacity="0.72"/>
                  <rect class="hero-art__twinkle-el" x="156" y="78" width="11" height="9" rx="1.5" opacity="0.88"/>
                  <rect class="hero-art__twinkle-el" x="172" y="78" width="11" height="9" rx="1.5" opacity="0.6"/>
                  <rect class="hero-art__twinkle-el" x="116" y="98" width="56" height="10" rx="2" opacity="0.45"/>
                  <rect class="hero-art__twinkle-el" x="116" y="114" width="56" height="10" rx="2" opacity="0.4"/>
                  <rect class="hero-art__twinkle-el" x="116" y="130" width="56" height="10" rx="2" opacity="0.5"/>
                </g>
                <!-- Mid-right -->
                <rect x="208" y="98" width="50" height="74" rx="5" fill="url(#haTower)"/>
                <g fill="url(#haWin)" opacity="0.32">
                  <rect x="216" y="108" width="9" height="7" rx="1"/>
                  <rect x="229" y="108" width="9" height="7" rx="1"/>
                  <rect x="242" y="108" width="9" height="7" rx="1"/>
                  <rect x="216" y="122" width="9" height="7" rx="1"/>
                  <rect x="229" y="122" width="9" height="7" rx="1"/>
                  <rect x="242" y="122" width="9" height="7" rx="1"/>
                </g>
                <!-- Tall right -->
                <rect x="270" y="62" width="68" height="110" rx="7" fill="url(#haTower)"/>
                <g fill="url(#haWin)" opacity="0.38">
                  <rect x="280" y="74" width="10" height="8" rx="1"/>
                  <rect x="294" y="74" width="10" height="8" rx="1"/>
                  <rect x="308" y="74" width="10" height="8" rx="1"/>
                  <rect x="322" y="74" width="10" height="8" rx="1"/>
                  <rect x="280" y="90" width="10" height="8" rx="1"/>
                  <rect x="294" y="90" width="10" height="8" rx="1"/>
                  <rect x="308" y="90" width="10" height="8" rx="1"/>
                  <rect x="322" y="90" width="10" height="8" rx="1"/>
                  <rect x="280" y="106" width="10" height="8" rx="1"/>
                  <rect x="294" y="106" width="10" height="8" rx="1"/>
                  <rect x="308" y="106" width="10" height="8" rx="1"/>
                  <rect x="322" y="106" width="10" height="8" rx="1"/>
                </g>
                <!-- Far right -->
                <rect x="352" y="88" width="52" height="84" rx="5" fill="url(#haTower)"/>
                <g fill="url(#haWin)" opacity="0.3">
                  <rect x="360" y="100" width="9" height="7" rx="1"/>
                  <rect x="373" y="100" width="9" height="7" rx="1"/>
                  <rect x="386" y="100" width="9" height="7" rx="1"/>
                  <rect x="360" y="114" width="9" height="7" rx="1"/>
                  <rect x="373" y="114" width="9" height="7" rx="1"/>
                  <rect x="386" y="114" width="9" height="7" rx="1"/>
                </g>
                <rect x="0" y="168" width="420" height="32" fill="url(#haGround)"/>
              </svg>
              <div class="hero-art__chips">
                <div class="hero-art__chip hero-art__chip--1">
                  <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22" aria-hidden="true">
                    <path d="M8 42V18L24 8l16 10v24H8z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
                    <path d="M18 42V28h12v14" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
                  </svg>
                </div>
                <div class="hero-art__chip hero-art__chip--2">
                  <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22" aria-hidden="true">
                    <rect x="10" y="8" width="28" height="34" rx="3" stroke="currentColor" stroke-width="2.2"/>
                    <path d="M16 16h16M16 24h10M16 32h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </div>
                <div class="hero-art__chip hero-art__chip--3">
                  <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22" aria-hidden="true">
                    <path d="M8 14c0-2 2-4 4-4h8l4 4h12c2 0 4 2 4 4v20c0 2-2 4-4 4H12c-2 0-4-2-4-4V14z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
                    <path d="M16 22h16M16 30h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </div>
              </div>
            </div>
            <figcaption class="hero-art__caption">
              <span class="hero-art__step"><span class="hero-art__badge hero-art__badge--1"></span><span data-i18n="home.f1t"></span></span>
              <span class="hero-art__step"><span class="hero-art__badge hero-art__badge--2"></span><span data-i18n="home.f2t"></span></span>
              <span class="hero-art__step"><span class="hero-art__badge hero-art__badge--3"></span><span data-i18n="home.f3t"></span></span>
            </figcaption>
          </figure>
        </div>
      </div>

      <div class="hero__slant" aria-hidden="true"></div>
    </main>

    <section id="features" class="section section--features">
      <div class="section__head">
        <h2 class="section__title" data-i18n="home.featuresTitle"></h2>
        <div class="section__rule" aria-hidden="true"></div>
      </div>

      <div class="feature-grid">
        <article class="feature-card">
          <div class="feature-card__icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
              <path d="M8 42V18L24 8l16 10v24H8z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M18 42V28h12v14" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            </svg>
          </div>
          <h3 class="feature-card__title" data-i18n="home.f1t"></h3>
          <p class="feature-card__text" data-i18n="home.f1d"></p>
        </article>

        <article class="feature-card">
          <div class="feature-card__icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
              <rect x="10" y="8" width="28" height="34" rx="3" stroke="currentColor" stroke-width="2.2"/>
              <path d="M16 16h16M16 24h10M16 32h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <h3 class="feature-card__title" data-i18n="home.f2t"></h3>
          <p class="feature-card__text" data-i18n="home.f2d"></p>
        </article>

        <article class="feature-card">
          <div class="feature-card__icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
              <path d="M8 14c0-2 2-4 4-4h8l4 4h12c2 0 4 2 4 4v20c0 2-2 4-4 4H12c-2 0-4-2-4-4V14z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M16 22h16M16 30h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <h3 class="feature-card__title" data-i18n="home.f3t"></h3>
          <p class="feature-card__text" data-i18n="home.f3d"></p>
        </article>
      </div>
    </section>

    <section id="how" class="section section--how">
      <div class="section__head">
        <h2 class="section__title" data-i18n="home.howTitle"></h2>
        <div class="section__rule" aria-hidden="true"></div>
      </div>

      <ol class="steps" data-i18n-aria-label="home.howTitle" aria-label="">
        <li class="step-card">
          <span class="step-card__num" aria-hidden="true">1</span>
          <div class="step-card__body">
            <h3 class="step-card__title" data-i18n="home.h1t"></h3>
            <p class="step-card__text" data-i18n="home.h1d"></p>
          </div>
        </li>
        <li class="step-card">
          <span class="step-card__num" aria-hidden="true">2</span>
          <div class="step-card__body">
            <h3 class="step-card__title" data-i18n="home.h2t"></h3>
            <p class="step-card__text" data-i18n="home.h2d"></p>
          </div>
        </li>
        <li class="step-card">
          <span class="step-card__num" aria-hidden="true">3</span>
          <div class="step-card__body">
            <h3 class="step-card__title" data-i18n="home.h3t"></h3>
            <p class="step-card__text" data-i18n="home.h3d"></p>
          </div>
        </li>
      </ol>
    </section>

    <section id="contact" class="contact-band">
      <div class="contact-band__inner">
        <div class="contact-band__copy">
          <h2 class="contact-band__title" data-i18n="home.contactTitle"></h2>
          <p class="contact-band__sub" data-i18n="home.contactSoon"></p>
        </div>
        <a href="support.html" class="btn btn--primary btn--lg contact-band__cta" data-i18n="nav.supportGuest"></a>
      </div>
    </section>

    <footer class="footer">
      <p id="footerText"></p>
      <a class="to-top" href="#top" data-i18n="home.toTop"></a>
    </footer>
  </div>

  <script>
    function setHomeFooter() {
      var el = document.getElementById("footerText");
      if (el && window.walajna_language) {
        el.textContent = walajna_language.t("home.footer", {
          year: new Date().getFullYear()
        });
      }
    }
    document.addEventListener("DOMContentLoaded", setHomeFooter);
    document.addEventListener("walajna:i18n-applied", setHomeFooter);
  </script>
  <script src="../js/main/theme.js"></script>
  <script src="../js/main/auth.js"></script>
  <script src="../js/main/nav.js"></script>
</body>
</html>
