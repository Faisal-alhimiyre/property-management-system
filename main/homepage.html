<!DOCTYPE html>
<html lang="ar" dir="rtl" id="top">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.homepage"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/homepage.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
</head>

<body data-nav="guest" data-global-back="false">

  <div id="navbar-container"></div>

  <div class="home-surface">
    <main id="home" class="hero hero--catchy">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__mesh"></div>
        <div class="hero__orb hero__orb--1"></div>
        <div class="hero__orb hero__orb--2"></div>
      </div>

      <div class="hero__inner">
        <div class="hero__content">
          <div class="badge badge--pulse" data-i18n="home.badge"></div>

          <h1 class="hero__title">
            <span class="hero__title-line" data-i18n="home.heroTitle1"></span>
            <span class="hero__title-line hero__title-line--accent" data-i18n="home.heroAccent"></span>
          </h1>

          <p class="hero__subtitle" data-i18n="home.heroSub"></p>

          <div class="hero__buttons">
            <a href="../auth/login.html" class="btn btn--primary btn--lg btn--pop" data-i18n="home.ctaStart"></a>
            <a href="#features" class="btn btn--ghost btn--lg btn--outline-pop" data-i18n="home.ctaMore"></a>
          </div>

          <div class="stats stats--loud" role="list">
            <div class="stat" role="listitem">
              <div class="stat__value">50K+</div>
              <div class="stat__label" data-i18n="home.statUsers"></div>
            </div>
            <div class="stat" role="listitem">
              <div class="stat__value">4.9★</div>
              <div class="stat__label" data-i18n="home.statRating"></div>
            </div>
            <div class="stat" role="listitem">
              <div class="stat__value">99%</div>
              <div class="stat__label" data-i18n="home.statAccuracy"></div>
            </div>
          </div>
        </div>

        <div class="hero__showcase" aria-hidden="true">
          <div class="showcase-stack">
            <div class="showcase-card showcase-card--a"></div>
            <div class="showcase-card showcase-card--b"></div>
            <div class="showcase-card showcase-card--c"></div>
          </div>
          <div class="showcase-ring"></div>
        </div>
      </div>

      <div class="hero__slant" aria-hidden="true"></div>
    </main>

    <section id="features" class="section section--features">
      <div class="section__head">
        <h2 class="section__title" data-i18n="home.featuresTitle"></h2>
        <div class="section__rule" aria-hidden="true"></div>
      </div>

      <div class="feature-grid">
        <article class="feature-card">
          <div class="feature-card__icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
              <path d="M8 42V18L24 8l16 10v24H8z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M18 42V28h12v14" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
            </svg>
          </div>
          <h3 class="feature-card__title" data-i18n="home.f1t"></h3>
          <p class="feature-card__text" data-i18n="home.f1d"></p>
        </article>

        <article class="feature-card">
          <div class="feature-card__icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
              <rect x="10" y="8" width="28" height="34" rx="3" stroke="currentColor" stroke-width="2.2"/>
              <path d="M16 16h16M16 24h10M16 32h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <h3 class="feature-card__title" data-i18n="home.f2t"></h3>
          <p class="feature-card__text" data-i18n="home.f2d"></p>
        </article>

        <article class="feature-card">
          <div class="feature-card__icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="28" height="28">
              <path d="M8 14c0-2 2-4 4-4h8l4 4h12c2 0 4 2 4 4v20c0 2-2 4-4 4H12c-2 0-4-2-4-4V14z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M16 22h16M16 30h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <h3 class="feature-card__title" data-i18n="home.f3t"></h3>
          <p class="feature-card__text" data-i18n="home.f3d"></p>
        </article>
      </div>
    </section>

    <section id="how" class="section section--how">
      <div class="section__head">
        <h2 class="section__title" data-i18n="home.howTitle"></h2>
        <div class="section__rule" aria-hidden="true"></div>
      </div>

      <ol class="steps" data-i18n-aria-label="home.howTitle" aria-label="">
        <li class="step-card">
          <span class="step-card__num" aria-hidden="true">1</span>
          <div class="step-card__body">
            <h3 class="step-card__title" data-i18n="home.h1t"></h3>
            <p class="step-card__text" data-i18n="home.h1d"></p>
          </div>
        </li>
        <li class="step-card">
          <span class="step-card__num" aria-hidden="true">2</span>
          <div class="step-card__body">
            <h3 class="step-card__title" data-i18n="home.h2t"></h3>
            <p class="step-card__text" data-i18n="home.h2d"></p>
          </div>
        </li>
        <li class="step-card">
          <span class="step-card__num" aria-hidden="true">3</span>
          <div class="step-card__body">
            <h3 class="step-card__title" data-i18n="home.h3t"></h3>
            <p class="step-card__text" data-i18n="home.h3d"></p>
          </div>
        </li>
      </ol>
    </section>

    <section id="contact" class="contact-band">
      <div class="contact-band__inner">
        <div class="contact-band__copy">
          <h2 class="contact-band__title" data-i18n="home.contactTitle"></h2>
          <p class="contact-band__sub" data-i18n="home.contactSoon"></p>
        </div>
        <a href="support.html" class="btn btn--primary btn--lg contact-band__cta" data-i18n="nav.supportGuest"></a>
      </div>
    </section>

    <footer class="footer">
      <p id="footerText"></p>
      <a class="to-top" href="#top" data-i18n="home.toTop"></a>
    </footer>
  </div>

  <script>
    function setHomeFooter() {
      var el = document.getElementById("footerText");
      if (el && window.walajna_language) {
        el.textContent = walajna_language.t("home.footer", {
          year: new Date().getFullYear()
        });
      }
    }
    document.addEventListener("DOMContentLoaded", setHomeFooter);
    document.addEventListener("walajna:i18n-applied", setHomeFooter);
  </script>
  <script src="../js/main/theme.js"></script>
  <script src="../js/main/nav.js"></script>
</body>
</html>
