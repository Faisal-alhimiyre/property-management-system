<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Walajna navbar</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/navstyle.css" />
</head>

<body>
  <header class="walajna-topbar">
    <div class="walajna-topbar__inner">

      <nav class="walajna-topbar__nav" aria-label="التنقل الرئيسي">
        <a id="nav-home" href="#" class="is-active">الرئيسية</a>
        <a id="nav-link-2" href="#">العماير/الشقق</a>
        <a id="nav-link-3" href="#">الخدمات</a>
        <a id="nav-link-4" href="#">الرسائل</a>
      </nav>

      <div class="walajna-topbar__brand">
        <a id="nav-logo-link" href="#" class="brand-logo-link" aria-label="الشعار">
          <img src="../pics/logo.png" alt="WALAJNA" class="brand-logo">
        </a>
      </div>

      <div class="walajna-topbar__icons">
        <a id="nav-support" class="icon-btn" href="#" aria-label="الدعم الفني" title="الدعم الفني">🎧</a>
        <a id="nav-settings" class="icon-btn" href="#" aria-label="الإعدادات" title="الإعدادات">⚙️</a>
      </div>

    </div>
  </header>
</body>
</html>
