<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.navbarTitle">Walajna navbar</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/navstyle.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
</head>

<body>
  <header class="walajna-topbar">
    <div class="walajna-topbar__inner">

      <button
        type="button"
        class="walajna-nav-toggle"
        id="walajna-nav-toggle"
        aria-expanded="false"
        aria-controls="walajna-nav-panel"
        data-i18n-aria-label="nav.openMenu"
      >
        <span class="walajna-nav-toggle__bars" aria-hidden="true"></span>
      </button>

      <div class="walajna-nav-panel" id="walajna-nav-panel">
        <nav class="walajna-topbar__nav" data-i18n-aria-label="nav.main" aria-label="">
          <a id="nav-home" href="#" class="is-active"></a>
          <a id="nav-link-2" href="#"></a>
          <a id="nav-link-3" href="#"></a>
          <a id="nav-link-4" href="#"></a>
        </nav>
      </div>

      <div class="walajna-topbar__brand">
        <a id="nav-logo-link" href="#" class="brand-logo-link" data-i18n-aria-label="common.logo" aria-label="">
          <img src="../pics/logo.png" alt="ALAJNA" class="brand-logo">
        </a>
      </div>

      <div class="walajna-topbar__icons">
        <a id="nav-support" class="icon-btn" href="#" aria-label="" title="">🎧</a>
        <a id="nav-settings" class="icon-btn" href="#" aria-label="" title="">⚙️</a>
      </div>

    </div>
    <button type="button" class="walajna-nav-backdrop" id="walajna-nav-backdrop" hidden aria-hidden="true" tabindex="-1"></button>
  </header>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.walajna_language && typeof window.walajna_language.apply === "function") {
        window.walajna_language.apply(document);
      }
    });
  </script>
</body>
</html>
