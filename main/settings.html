<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.settingsTitle"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/navstyle.css" />
  <link rel="stylesheet" href="../css/settings.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
</head>
<body data-nav-adaptive="true" data-wl-bc="settings">
  <script>
    (function () {
      try {
        var logged =
          !!(
            sessionStorage.getItem("walajna_current_user") ||
            localStorage.getItem("walajna_current_user") ||
            localStorage.getItem("access_token")
          );
        document.body.setAttribute("data-nav", logged ? "user" : "guest");
      } catch (e) {
        document.body.setAttribute("data-nav", "guest");
      }
    })();
  </script>
  <div id="navbar-container"></div>

  <main class="settings-wrap">
    <aside class="sidebar">
      <button type="button" class="side-link active" data-section="profile" data-i18n="settings.sidebar.profile"></button>
      <button type="button" class="side-link" data-section="security" data-i18n="settings.sidebar.security"></button>
      <button type="button" class="side-link" data-section="appearance" data-i18n="settings.sidebar.appearance"></button>
      <button type="button" class="side-link" data-section="support" data-i18n="settings.sidebar.support"></button>
      <button type="button" class="side-link" data-section="privacy" data-i18n="settings.sidebar.privacy"></button>
    </aside>

    <section class="content">
      <section id="profile" class="panel active">
        <div class="panel-header">
          <h2 data-i18n="settings.profile.title"></h2>
          <p data-i18n="settings.profile.subtitle"></p>
        </div>

        <div class="profile-card">
          <div class="avatar" id="avatarLetter">W</div>

          <div class="profile-details">
            <div class="detail-row">
              <span class="label" data-i18n="settings.label.fullName"></span>
              <span class="value" id="p_fullName">—</span>
            </div>

            <div class="detail-row">
              <span class="label" data-i18n="settings.label.email"></span>
              <span class="value ltr" id="p_email">—</span>
            </div>

            <div class="detail-row">
              <span class="label" data-i18n="settings.label.phone"></span>
              <span class="value ltr mono" id="p_phone">—</span>
            </div>

            <div class="detail-row">
              <span class="label" data-i18n="settings.label.nationalId"></span>
              <span class="value ltr mono" id="p_nationalId">—</span>
            </div>

            <div class="detail-row">
              <span class="label" data-i18n="settings.label.accountType"></span>
              <span class="role-badge" id="p_role">—</span>
            </div>
          </div>
        </div>

        <div class="panel-actions">
          <button type="button" class="btn btn-outline" id="openEditInfoModal" data-i18n="settings.editInfo"></button>
          <button type="button" class="btn btn-danger-outline" id="logoutBtn" data-i18n="settings.logout"></button>
        </div>

        <p class="panel-note" data-i18n="settings.profileNote"></p>
      </section>

      <section id="security" class="panel">
        <div class="panel-header">
          <h2 data-i18n="settings.security.title"></h2>
          <p data-i18n="settings.security.subtitle"></p>
        </div>

        <div class="form-card">
          <div class="form-row">
            <label for="currentPassword" data-i18n="settings.currentPassword"></label>
            <input type="password" id="currentPassword" data-i18n-placeholder="settings.ph.currentPassword" placeholder="" />
          </div>

          <div class="form-row">
            <label for="newPassword" data-i18n="settings.newPassword"></label>
            <input type="password" id="newPassword" data-i18n-placeholder="settings.ph.newPassword" placeholder="" />
          </div>

          <div class="form-row">
            <label for="confirmNewPassword" data-i18n="settings.confirmNewPassword"></label>
            <input type="password" id="confirmNewPassword" data-i18n-placeholder="settings.ph.confirmNewPassword" placeholder="" />
          </div>

          <button type="button" class="btn btn-primary" id="savePasswordBtn" data-i18n="settings.updatePassword"></button>
          <p class="message" id="passwordMessage"></p>
        </div>
      </section>

      <section id="appearance" class="panel">
        <div class="panel-header">
          <h2 data-i18n="settings.appearance.title"></h2>
          <p data-i18n="settings.appearance.subtitle"></p>
        </div>

        <div class="settings-card">
          <div class="setting-item">
            <div>
              <h3 data-i18n="settings.darkMode"></h3>
              <p data-i18n="settings.darkModeDesc"></p>
            </div>

            <label class="switch">
              <input type="checkbox" id="themeToggle" />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-card">
          <div class="setting-item">
            <div>
              <h3 data-i18n="settings.lang.title"></h3>
              <p data-i18n="settings.lang.subtitle"></p>
            </div>
            <select id="walajnaLangSelect" class="nav-role-switcher__select" aria-label="">
              <option value="ar" data-i18n-label="settings.lang.ar"></option>
              <option value="en" data-i18n-label="settings.lang.en"></option>
              <option value="ur" data-i18n-label="settings.lang.ur"></option>
            </select>
          </div>
        </div>
      </section>

      <section id="support" class="panel">
        <div class="panel-header">
          <h2 data-i18n="settings.supportPanel.title"></h2>
          <p data-i18n="settings.supportPanel.subtitle"></p>
        </div>

        <div class="support-card">
          <div class="support-text">
            <h3 data-i18n="settings.supportNeedHelp"></h3>
            <p data-i18n="settings.supportDesc"></p>
          </div>

          <a href="../main/support.html" class="btn btn-primary" data-i18n="settings.openSupport"></a>
        </div>
      </section>

      <section id="privacy" class="panel">
        <div class="panel-header">
          <h2 data-i18n="settings.privacy.title"></h2>
          <p data-i18n="settings.privacy.subtitle"></p>
        </div>

        <div class="privacy-card">
          <div class="privacy-box">
            <h3 data-i18n="settings.deleteAccount.title"></h3>
            <p data-i18n="settings.deleteAccount.desc"></p>
            <button type="button" class="btn btn-danger" id="deleteAccountBtn" data-i18n="settings.deleteAccount.btn"></button>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div class="wl-modal" id="editInfoModal" aria-hidden="true">
    <div class="wl-modal__backdrop" data-close="true"></div>

    <div class="wl-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="editInfoTitle">
      <button class="wl-modal__close" id="closeEditInfoModal" type="button" data-i18n-aria-label="common.close" aria-label="">×</button>

      <div class="wl-modal__header">
        <h3 id="editInfoTitle" data-i18n="settings.modal.editTitle"></h3>
        <p data-i18n="settings.modal.editDesc"></p>
      </div>

      <div class="wl-tabs">
        <button type="button" class="wl-tab is-active" data-tab="emailPanel" data-i18n="settings.tab.email"></button>
        <button type="button" class="wl-tab" data-tab="phonePanel" data-i18n="settings.tab.phone"></button>
      </div>

      <div class="wl-panel is-active" id="emailPanel">
        <label for="newEmail" data-i18n="settings.newEmail"></label>
        <input type="email" id="newEmail" placeholder="example@email.com" />

        <button type="button" class="btn btn-primary wl-full" id="sendEmailCodeBtn" data-i18n="settings.sendEmailCode"></button>

        <p class="wl-hint" id="emailCodeHint"></p>

        <label for="emailCode" data-i18n="settings.enterCode"></label>
        <input type="text" id="emailCode" maxlength="6" data-i18n-placeholder="settings.ph.code6" placeholder="" />

        <button type="button" class="btn btn-primary wl-full" id="verifyEmailBtn" data-i18n="settings.verifyEmail"></button>
      </div>

      <div class="wl-panel" id="phonePanel">
        <label for="newPhone" data-i18n="settings.newPhone"></label>
        <input type="text" id="newPhone" maxlength="10" data-i18n-placeholder="settings.ph.phoneNew" placeholder="" />

        <button type="button" class="btn btn-primary wl-full" id="sendPhoneCodeBtn" data-i18n="settings.sendPhoneCode"></button>

        <p class="wl-hint" id="phoneCodeHint"></p>

        <label for="phoneCode" data-i18n="settings.enterCode"></label>
        <input type="text" id="phoneCode" maxlength="6" data-i18n-placeholder="settings.ph.code6" placeholder="" />

        <button type="button" class="btn btn-primary wl-full" id="verifyPhoneBtn" data-i18n="settings.verifyPhone"></button>
      </div>

      <p class="message" id="editInfoMessage"></p>
    </div>
  </div>

  <script src="../js/main/theme.js"></script>
  <script src="../js/main/auth.js"></script>
  <script src="../js/main/settings.js"></script>
  <script src="../js/main/breadcrumbs.js"></script>
  <script src="../js/main/nav.js"></script>
</body>
</html>
