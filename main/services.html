<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.servicesTitle">الخدمات | Walajna</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/navstyle.css" />
  <link rel="stylesheet" href="../css/services.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
</head>
<body data-nav-adaptive="true" data-wl-bc="services">
  <script>
    (function () {
      try {
        var logged =
          !!(
            sessionStorage.getItem("walajna_current_user") ||
            localStorage.getItem("walajna_current_user") ||
            localStorage.getItem("access_token")
          );
        document.body.setAttribute("data-nav", logged ? "user" : "guest");
      } catch (e) {
        document.body.setAttribute("data-nav", "guest");
      }
    })();
  </script>

  <div id="navbar-container"></div>

  <div class="services-shell">
    <main class="services-main">
      <header class="services-hero glass-card">
        <h1 class="services-title" data-i18n="nav.services"></h1>
        <p class="services-subtitle" data-i18n="services.pageSubtitle"></p>
      </header>

      <section class="services-actions-grid" aria-label="Services actions">
        <a class="service-tile service-tile--finance" href="../owners/portfolio_finance.html">
          <span class="service-tile__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18"/>
              <path d="M7 14l4-4 3 3 5-6"/>
            </svg>
          </span>
          <strong class="service-tile__title" data-i18n="finance.allBuildingsBtn"></strong>
          <span class="service-tile__hint" data-i18n="services.hint.finance"></span>
          <span class="service-tile__go" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </span>
        </a>

        <a class="service-tile service-tile--costs" href="../owners/portfolio_costs.html">
          <span class="service-tile__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6M8 13h8M8 17h5"/>
            </svg>
          </span>
          <strong class="service-tile__title" data-i18n="finance.costDetailsBtn"></strong>
          <span class="service-tile__hint" data-i18n="services.hint.costs"></span>
          <span class="service-tile__go" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </span>
        </a>

        <a class="service-tile service-tile--archive" href="../owners/owner_archive.html">
          <span class="service-tile__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 8v13H3V8"/>
              <path d="M1 3h22v5H1zM10 12h4"/>
            </svg>
          </span>
          <strong class="service-tile__title" data-i18n="owner.archiveBtn"></strong>
          <span class="service-tile__hint" data-i18n="services.hint.archive"></span>
          <span class="service-tile__go" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </span>
        </a>
      </section>
    </main>
  </div>

  <script src="../js/main/theme.js"></script>
  <script src="../js/main/auth.js"></script>
  <script src="../js/main/breadcrumbs.js"></script>
  <script src="../js/main/nav.js"></script>
  <script>
    document.addEventListener("walajna:navbar-ready", function () {
      var role =
        typeof WalajnaAuth !== "undefined" && WalajnaAuth.getActiveRole
          ? WalajnaAuth.getActiveRole()
          : sessionStorage.getItem("activeRole");
      if (role === "tenant") {
        window.location.replace("../tenants/tenant_home.html");
      }
    });
  </script>
</body>
</html>
