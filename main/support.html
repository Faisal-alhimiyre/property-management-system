<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ولاجنا | الدعم الفني</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/support.css" />
</head>
<body data-nav="user">

 <div id="navbar-container"> </div>

  <main class="wrap">
    <section class="chat" id="chat" aria-label="Live chat">
      <!-- Welcome message -->
      <div class="msg bot">
        <div class="bubble">
          أهلًا 👋 أنا دعم ولاجنا. اختر موضوعًا أو اكتب سؤالك.
          <div class="chips">
            <button class="chip" data-q="نسيت كلمة المرور">نسيت كلمة المرور</button>
            <button class="chip" data-q="مشكلة تسجيل الدخول">مشكلة تسجيل الدخول</button>
            <button class="chip" data-q="الهوية الوطنية غير صحيحة">الهوية الوطنية</button>
            <button class="chip" data-q="كيف أربط مستأجر بالشقة؟">ربط مستأجر</button>
            <button class="chip" data-q="كيف أضيف مبنى وشقق؟">إضافة مبنى</button>
          </div>
        </div>
        <div class="meta">الآن</div>
      </div>
    </section>

    <form class="composer" id="form">
      <input id="input" type="text" placeholder="اكتب رسالتك هنا..." autocomplete="off" />
      <button class="send" type="submit">إرسال</button>
    </form>
  </main>

  <script src="../js/main/theme.js"></script>
  <script src="../js/main/support.js"></script>
  <script src="../js/main/nav.js"></script>
</body>
</html>
