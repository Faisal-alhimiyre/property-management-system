<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.supportTitle"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/navstyle.css" />
  <link rel="stylesheet" href="../css/support.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
  <script src="../js/main/walajna-dialog.js"></script>
</head>
<body data-nav-adaptive="true" data-wl-bc="support">
  <script>
    (function () {
      try {
        var logged =
          !!(
            sessionStorage.getItem("walajna_current_user") ||
            localStorage.getItem("walajna_current_user") ||
            localStorage.getItem("access_token")
          );
        document.body.setAttribute("data-nav", logged ? "user" : "guest");
      } catch (e) {
        document.body.setAttribute("data-nav", "guest");
      }
    })();
  </script>
  <div id="navbar-container"></div>

  <main class="wrap">
    <section class="chat" id="chat" data-i18n-aria-label="support.ariaChat" aria-label="">
      <div class="msg bot welcome">
        <div class="bubble">
          <span data-i18n="support.welcome"></span>
          <div class="chips">
            <button type="button" class="chip" data-q="forgot password" data-i18n="support.chipForgot"></button>
            <button type="button" class="chip" data-q="login problem" data-i18n="support.chipLogin"></button>
            <button type="button" class="chip" data-q="national id" data-i18n="support.chipNationalId"></button>
            <button type="button" class="chip" data-q="link tenant" data-i18n="support.chipTenant"></button>
            <button type="button" class="chip" data-q="add building" data-i18n="support.chipBuilding"></button>
          </div>
        </div>
        <div class="meta" data-i18n="support.now"></div>
      </div>
    </section>

    <form class="composer" id="form">
      <input id="input" type="text" data-i18n-placeholder="support.placeholder" placeholder="" autocomplete="off" />
      <button class="send" type="submit" data-i18n="support.send"></button>
    </form>
  </main>

  <script src="../js/main/theme.js"></script>
  <script src="../js/main/supabase-config.js"></script>
  <script src="../js/main/support.js"></script>
  <script src="../js/main/breadcrumbs.js"></script>
  <script src="../js/main/nav.js"></script>
</body>
</html>
