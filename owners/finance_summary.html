<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الملخص المالي</title>

  <link rel="stylesheet" href="../../css/theme.css" />
  <link rel="stylesheet" href="../../css/navstyle.css" />
  <link rel="stylesheet" href="../../css/finance-summary.css" />
</head>
<body data-nav="user">
  <main class="finance-page">

    <section class="finance-hero">
      <div class="finance-hero__header">
        <div class="finance-hero__content">
          <h1 id="buildingName" class="finance-title">الملخص المالي</h1>
          <p class="finance-subtitle">عرض مالي تفصيلي حسب الفترة المختارة</p>
        </div>

        <div class="finance-filters">
          <div class="finance-filter-group">
            <label for="periodSelect" class="finance-filter-label">طريقة العرض</label>
            <select id="periodSelect" class="finance-select">
              <option value="monthly">شهري</option>
              <option value="quarterly">ربع سنوي</option>
              <option value="semi">نصف سنوي</option>
              <option value="annual">سنوي</option>
            </select>
          </div>

          <div class="finance-filter-group">
            <label for="periodDate" class="finance-filter-label">التاريخ</label>
            <input id="periodDate" class="finance-date-input" type="date" />
          </div>
        </div>
      </div>
    </section>

    <p id="periodCaption" class="finance-period-caption"></p>

    <section class="finance-cards">
      <article class="finance-card">
        <span class="finance-card__label">الدخل</span>
        <strong id="incomeValue" class="finance-card__value">0 ريال</strong>
      </article>

      <article class="finance-card">
        <span class="finance-card__label">التكاليف</span>
        <strong id="costValue" class="finance-card__value">0 ريال</strong>
      </article>

      <article class="finance-card">
        <span class="finance-card__label">الربح</span>
        <strong id="profitValue" class="finance-card__value">0 ريال</strong>
      </article>

      <article class="finance-card">
        <span class="finance-card__label">المتأخرات</span>
        <strong id="lateValue" class="finance-card__value">0 ريال</strong>
      </article>
    </section>

    <section class="finance-table-section">
      <div class="finance-table-header">
        <h2>تفاصيل الشقق</h2>
        <span id="tableMeta" class="finance-table-meta">0 شقة</span>
      </div>

      <div class="finance-table-wrap">
        <table class="finance-table">
          <thead>
            <tr>
              <th>الشقة</th>
              <th>المستأجر</th>
              <th>الحالة</th>
              <th>الدخل</th>
              <th>التكاليف</th>
              <th>المتأخرات</th>
              <th>ملاحظات</th>
              <th>الربح</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
          <tfoot>
            <tr>
              <td colspan="3">الإجمالي</td>
              <td id="totalIncome">0 ريال</td>
              <td id="totalCosts">0 ريال</td>
              <td id="totalLate">0 ريال</td>
              <td>—</td>
              <td id="totalProfit">0 ريال</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </section>

  </main>

  <script src="../js/main/auth.js"></script>
  <script src="../js/main/theme.js"></script>
  <script src="../js/owner-manager/finance-summary.js"></script>
</body>
</html>
