<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إضافة عمارة - ولجنا</title>

  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/navstyle.css">
  <link rel="stylesheet" href="../css/owner-edit.css">
</head>
<body data-nav="user">
  <div id="navbar-container"></div>

  <main class="owner-form-page">
    <section class="form-card">
      <h2 class="form-title">إضافة عمارة</h2>
      <p class="form-subtitle">أدخل بيانات العمارة وعدد الشقق</p>

      <form id="buildingForm" class="building-form">
        <div class="form-group full">
          <label for="buildingName">اسم العمارة</label>
          <input type="text" id="buildingName" placeholder="مثال: عمارة الخالدية 1" required>
        </div>

        <div class="form-group">
          <label for="buildingCode">رمز العمارة</label>
          <input type="text" id="buildingCode" readonly class="form-input">
        </div>

        <div class="form-group select-group">
          <label for="building-city">المدينة</label>
          <select id="building-city" required>
            <option value="">اختر المدينة</option>
          </select>
        </div>

        <div class="form-group full">
          <label for="apartmentCount">عدد الشقق</label>
          <input type="number" id="apartmentCount" min="1" placeholder="مثال: 14" required>
        </div>

        <div class="form-group">
          <label for="totalFloors">عدد الطوابق</label>
          <input type="number" id="totalFloors" min="1" placeholder="مثال: 7" />
        </div>

        <div class="form-group">
          <label for="apartmentsPerFloor">عدد الشقق في كل طابق</label>
          <input type="number" id="apartmentsPerFloor" min="1" placeholder="مثال: 2" />
        </div>

        <!-- NEW: apartment details -->
        <div class="form-group">
          <label for="bedrooms">عدد غرف النوم</label>
          <input type="number" id="bedrooms" min="0" placeholder="مثال: 3" required>
        </div>

        <div class="form-group">
          <label for="bathrooms">عدد دورات المياه</label>
          <input type="number" id="bathrooms" min="0" placeholder="مثال: 2" required>
        </div>

        <div class="form-group">
          <label for="livingRooms">عدد غرف المعيشة</label>
          <input type="number" id="livingRooms" min="0" placeholder="مثال: 1" required>
        </div>

        <div class="form-group select-group">
          <label for="defaultPaymentCycle">دورة الدفع الافتراضية</label>
          <select id="defaultPaymentCycle" required>
            <option value="monthly">شهري</option>
            <option value="quarterly">ربع سنوي</option>
            <option value="semi_annual">نصف سنوي</option>
            <option value="annual">سنوي</option>
          </select>
        </div>

        <button type="submit" class="save-btn">حفظ العمارة</button>
        <p id="formMessage" class="form-message"></p>
      </form>
    </section>
  </main>

  <script src="../js/main/auth.js"></script>
  <script src="../js/main/nav.js"></script>
  <script src="../js/owner-manager/owner-edit.js"></script>
  <script src="../js/main/theme.js"></script>
</body>
</html>
