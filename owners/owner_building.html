<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem('walajna_language')||'ar';if(l!=='en'&&l!=='ar'&&l!=='ur')l='ar';document.documentElement.setAttribute('lang',l==='en'?'en':(l==='ur'?'ur':'ar'));document.documentElement.setAttribute('dir',l==='en'?'ltr':'rtl');}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.ownerBuildingPage">شقق العمارة</title>

  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/navstyle.css">
  <link rel="stylesheet" href="../css/owner-building.css">
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
</head>

<body data-nav="user" data-wl-bc="owner-building">

  <div id="navbar-container"></div>

  <main class="owner-building-wrap">
    <section class="building-shell">
      <div class="building-shell__header">
        <h2 id="buildingTitle">—</h2>
      </div>

      <section class="building-finance-summary">
        <div class="finance-card">
          <span class="finance-label" data-i18n="finance.monthlyIncome">الدخل الشهري</span>
          <strong id="buildingIncome">0</strong>
        </div>

        <div class="finance-card">
          <span class="finance-label" data-i18n="finance.expenses">المصروفات</span>
          <strong id="buildingCosts">0</strong>
        </div>

        <div class="finance-card">
          <span class="finance-label" data-i18n="finance.monthlyProfit">الربح الشهري</span>
          <strong id="buildingProfit">0</strong>
        </div>
      </section>

      <div class="finance-link-row finance-link-row--solo">
        <button
          id="financeSummaryBtn"
          class="finance-summary-btn finance-summary-btn--primary"
          type="button"
          data-i18n="finance.viewSummaryBtn"
        >
          عرض الملخص المالي
        </button>
      </div>

      <div class="building-stats">
        <div class="building-stat-item">
          <span class="building-stat-label" data-i18n="finance.rentedUnits">الوحدات المؤجرة</span>
          <strong id="buildingOccupiedUnits">0 / 0</strong>
        </div>

        <div class="building-stat-item">
          <span class="building-stat-label" data-i18n="finance.lateUnits">الشقق المتأخرة</span>
          <strong id="buildingLateUnits">0</strong>
        </div>
      </div>

      <section id="apartmentsGrid" class="apartments-grid"></section>
    </section>

  </main>

  <div id="editApartmentModal" class="apartment-edit-modal" aria-hidden="true">
    <div class="apartment-edit-modal__backdrop" data-close-edit-modal="true"></div>

    <div class="apartment-edit-modal__panel" role="dialog" aria-modal="true" aria-labelledby="editApartmentModalTitle">
      <div class="apartment-edit-modal__header">
        <div>
          <h3 id="editApartmentModalTitle" class="apartment-edit-modal__title" data-i18n="building.editModalTitle">تعديل الشقة</h3>
          <p class="apartment-edit-modal__subtitle" data-i18n="building.editModalSub">عدّل بيانات الشقة والمستأجر والعقد</p>
        </div>

        <button id="closeEditApartmentModal" class="apartment-edit-modal__close" type="button" data-i18n-aria-label="common.close">✕</button>
      </div>

      <div class="apartment-edit-modal__body">
        <div class="details-grid">
          <div class="item">
            <label class="label" for="linkFullName" data-i18n="auth.fullName">الاسم الكامل</label>
            <input id="linkFullName" type="text" autocomplete="name" />
          </div>

          <div class="item">
            <label class="label" for="linkNationalId" data-i18n="auth.nationalId">رقم الهوية / الإقامة</label>
            <input id="linkNationalId" type="text" maxlength="10" inputmode="numeric" data-wl-digits-only />
          </div>

          <div class="item">
            <label class="label" for="linkNationality" data-i18n="auth.nationality">الجنسية</label>
            <input id="linkNationality" type="text" />
          </div>

          <div class="item">
            <label class="label" for="linkTenantType" data-i18n="apt.label.tenantHousehold">أفراد أو عوائل</label>
            <select id="linkTenantType"></select>
          </div>

          <div class="item">
            <label class="label" for="linkPhoneNumber" data-i18n="auth.phone">رقم الجوال</label>
            <input id="linkPhoneNumber" type="text" maxlength="10" inputmode="numeric" data-wl-digits-only />
          </div>

          <div class="item">
            <label class="label" for="linkRent" data-i18n="paymentsUi.annualRent">الإيجار السنوي</label>
            <input id="linkRent" type="number" min="0" step="500" data-wl-numeric="money-500" />
          </div>

          <div class="item">
            <label class="label" for="linkFloorNumber" data-i18n="lease.floor">الدور</label>
            <input id="linkFloorNumber" type="number" min="0" readonly aria-readonly="true" />
          </div>

          <div class="item">
            <label class="label" for="linkRoomsCount" data-i18n="lease.rooms">عدد الغرف</label>
            <input id="linkRoomsCount" type="number" min="0" step="1" data-wl-numeric="integer" />
          </div>

          <div class="item">
            <label class="label" for="linkBathroomsCount" data-i18n="lease.bathrooms">عدد الحمامات</label>
            <input id="linkBathroomsCount" type="number" min="0" step="1" data-wl-numeric="integer" />
          </div>

          <div class="item">
            <label class="label" for="linkLivingRoomsCount" data-i18n="lease.living">عدد الصالات</label>
            <input id="linkLivingRoomsCount" type="number" min="0" step="1" data-wl-numeric="integer" />
          </div>

          <div class="item">
            <label class="label" for="linkPaymentCycle" data-i18n="lease.payCycle">دورة الدفع</label>
            <select id="linkPaymentCycle">
              <option value="monthly" data-i18n="payments.cycle.monthly">شهري</option>
              <option value="quarterly" data-i18n="payments.cycle.quarterly">ربع سنوي</option>
              <option value="semi_annual" data-i18n="payments.cycle.semi">نصف سنوي</option>
              <option value="annual" data-i18n="payments.cycle.annual">سنوي</option>
            </select>
          </div>

          <div class="item">
            <label class="label" for="linkInstallmentsCount" data-i18n="lease.installments">عدد الدفعات</label>
            <input id="linkInstallmentsCount" type="number" min="1" step="1" data-wl-numeric="integer" />
          </div>

          <div class="item">
            <label class="label" for="linkInsurancePaid" data-i18n="apt.link.insurance">التأمين المدفوع</label>
            <input id="linkInsurancePaid" type="text" inputmode="numeric" data-wl-digits-only />
          </div>

          <div class="item">
            <label class="label" for="linkStartDate" data-i18n="apt.link.startDate">تاريخ بداية العقد</label>
            <input id="linkStartDate" type="date" />
          </div>

          <div class="item">
            <label class="label" for="linkEndDate" data-i18n="apt.link.endDate">تاريخ نهاية العقد</label>
            <input id="linkEndDate" type="date" />
          </div>

          <div class="item">
            <label class="label" for="linkMeterNumber" data-i18n="lease.meter">رقم العداد</label>
            <input id="linkMeterNumber" type="text" inputmode="numeric" data-wl-digits-only />
          </div>

         <div class="item full-width">
  <label class="label" for="linkNotes" data-i18n="common.note">ملاحظات</label>
  <textarea id="linkNotes"></textarea>
</div>
        </div>

        <p id="linkTenantError" class="error"></p>
      </div>

      <div class="apartment-edit-modal__footer">
        <button id="saveLinkedTenantBtn" class="apartment-edit-btn primary" type="button" data-i18n="owner.saveEdits">
          حفظ التعديلات
        </button>

        <button id="cancelEditApartmentModal" class="apartment-edit-btn ghost" type="button" data-i18n="common.cancel">
          إلغاء
        </button>
      </div>
    </div>
  </div>

  <div id="buildingDetailsModal" class="apartment-edit-modal" aria-hidden="true">
    <div class="apartment-edit-modal__backdrop" data-close-building-details="true"></div>
    <div class="apartment-edit-modal__panel building-details-modal-panel" role="dialog" aria-modal="true" aria-labelledby="buildingDetailsModalTitle">
      <div class="apartment-edit-modal__header">
        <div>
          <h3 id="buildingDetailsModalTitle" class="apartment-edit-modal__title" data-i18n="building.detailsWizardTitle">تفاصيل العمارة</h3>
          <p id="buildingDetailsModalSubtitle" class="apartment-edit-modal__subtitle" data-i18n="building.detailsWizardStep1Short">وزّع الشقق على الأدوار</p>
        </div>
        <button id="closeBuildingDetailsModal" class="apartment-edit-modal__close" type="button" data-i18n-aria-label="common.close">✕</button>
      </div>

      <div class="apartment-edit-modal__body building-details-modal-body">
        <div id="buildingDetailsStep1Wrap" class="building-details-step1">
          <div class="building-details-step1-toolbar">
            <div class="building-details-floors-total item">
              <label class="label" for="wizardTotalFloorsInput" data-i18n="building.totalFloorsPrompt">عدد الطوابق</label>
              <input id="wizardTotalFloorsInput" type="number" min="1" max="200" step="1" readonly aria-readonly="true" data-i18n-title="building.totalFloorsReadonlyHint" />
            </div>
            <div
              id="buildingLayoutRemainingBar"
              class="building-layout-remaining"
              hidden
              aria-live="polite"
              aria-atomic="true"
            >
              <span class="building-layout-remaining__label" data-i18n="building.layoutRemainingLabel">شقق متبقية</span>
              <strong id="buildingLayoutRemainingCount" class="building-layout-remaining__count">0</strong>
            </div>
          </div>
          <div id="buildingDetailsPerFloorFields" class="building-details-per-floor"></div>
        </div>
        <div id="buildingDetailsStep2Wrap" class="building-details-step2" hidden>
          <div id="buildingDetailsBulkBar" class="building-details-bulk-bar">
            <div class="building-details-bulk-card building-details-bulk-card--compact">
              <div class="building-details-bulk-card-head">
                <span id="wizardBulkChecklistLegend" class="building-details-bulk-card-kicker" data-i18n="building.bulkPickApts">شقق لم تُضبط</span>
                <div class="building-details-bulk-pills" role="group">
                  <button type="button" id="wizardBulkSelectAllBtn" class="building-details-bulk-pill" data-i18n="building.bulkSelectRemaining">تحديد الباقي</button>
                  <button type="button" id="wizardBulkClearChecksBtn" class="building-details-bulk-pill building-details-bulk-pill--muted" data-i18n="building.bulkClearChecks">إلغاء التحديد</button>
                </div>
              </div>
              <p id="wizardBulkAllDone" class="building-details-bulk-done" hidden data-i18n="building.bulkAllConfigured">تم ضبط كل الشقق — عدّل أي شقة في القائمة أدناه.</p>
              <div id="wizardBulkChecklist" class="building-details-bulk-checklist" role="group" aria-labelledby="wizardBulkChecklistLegend"></div>
              <div class="building-details-bulk-apply-row">
              <div class="building-details-bulk-rooms">
                <div class="building-details-bulk-field">
                  <label class="building-details-bulk-label" for="wizardBulkBedrooms" data-i18n="lease.rooms">غرف</label>
                  <input id="wizardBulkBedrooms" class="building-details-bulk-input" type="number" min="0" step="1" value="0" />
                </div>
                <div class="building-details-bulk-field">
                  <label class="building-details-bulk-label" for="wizardBulkBathrooms" data-i18n="lease.bathrooms">حمامات</label>
                  <input id="wizardBulkBathrooms" class="building-details-bulk-input" type="number" min="0" step="1" value="0" />
                </div>
                <div class="building-details-bulk-field">
                  <label class="building-details-bulk-label" for="wizardBulkLiving" data-i18n="lease.living">صالات</label>
                  <input id="wizardBulkLiving" class="building-details-bulk-input" type="number" min="0" step="1" value="0" />
                </div>
              </div>
              <button id="wizardBulkApplyBtn" class="building-details-bulk-apply apartment-edit-btn primary" type="button" data-i18n="building.bulkApplyBtn">تطبيق</button>
              </div>
            </div>
          </div>
        </div>
        <div id="buildingDetailsStep3Wrap" class="building-details-step3" hidden>
          <p id="wizardConfirmProgress" class="building-details-confirm-progress" aria-live="polite"></p>
          <div id="buildingDetailsConfirmFields" class="building-details-confirm-list"></div>
        </div>
        <p id="buildingDetailsError" class="error" role="alert"></p>
      </div>

      <div class="apartment-edit-modal__footer building-details-footer">
        <div class="building-details-footer__cluster">
          <button id="buildingDetailsBackBtn" class="apartment-edit-btn ghost" type="button" hidden data-i18n="building.backStep">رجوع</button>
          <button id="cancelBuildingDetailsModal" class="apartment-edit-btn ghost" type="button" data-i18n="common.cancel">إلغاء</button>
        </div>
        <div class="building-details-footer__cluster building-details-footer__cluster--end">
          <button id="buildingDetailsNextBtn" class="apartment-edit-btn primary" type="button" disabled data-i18n="building.nextStepRooms">التالي</button>
          <button id="buildingDetailsSaveBtn" class="apartment-edit-btn primary" type="button" hidden data-i18n="building.saveLayout">حفظ التخطيط</button>
          <button id="buildingDetailsConfirmSaveBtn" class="apartment-edit-btn primary" type="button" hidden data-i18n="building.confirmSave">تأكيد وحفظ</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/main/breadcrumbs.js"></script>
  <script src="../js/main/auth.js"></script>
  <script src="../js/main/buildings-api.js"></script>
  <script src="../js/main/nav.js"></script>
  <script src="../js/main/theme.js"></script>
  <script src="../js/main/walajna-numeric-input.js"></script>
  <script src="../js/main/tenant-requests-api.js"></script>
  <script src="../js/main/payments-api.js"></script>
  <script src="../js/main/apartments-api.js"></script>
  <script src="../js/main/documents-api.js"></script>
  <script src="../js/main/saudi-national-id.js"></script>
  <script src="../js/owner-manager/owner-building.js"></script>
</body>
</html>
