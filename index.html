  <!-- Language -->
  <script>
    (function () {
      try {
        var l = localStorage.getItem("walajna_language") || "ar";

        if (l !== "en" && l !== "ar" && l !== "ur") {
          l = "ar";
        }

        document.documentElement.setAttribute(
          "lang",
          l === "en" ? "en" : (l === "ur" ? "ur" : "ar")
        );

        document.documentElement.setAttribute(
          "dir",
          l === "en" ? "ltr" : "rtl"
        );
      } catch (e) {}
    })();
  </script>


  <!-- Redirect already logged-in users to their dashboard -->
  <script>
    (function () {
      try {
        const currentUserRaw =
          sessionStorage.getItem("walajna_current_user") ||
          localStorage.getItem("walajna_current_user");

        const accessToken =
          localStorage.getItem("access_token");

        if (!currentUserRaw || !accessToken) {
          return;
        }

        let currentUser = null;

        try {
          currentUser = JSON.parse(currentUserRaw);
        } catch (e) {
          return;
        }

        const roles = Array.isArray(currentUser?.roles)
          ? currentUser.roles
          : [];

        let activeRole =
          sessionStorage.getItem("activeRole") ||
          localStorage.getItem("activeRole");

        if (!activeRole && roles.length === 1) {
          activeRole = roles[0];
        }

        if (activeRole === "owner") {
          location.replace("owners/owner_home.html");
          return;
        }

        if (activeRole === "tenant") {
          location.replace("tenants/tenant_home.html");
          return;
        }

      } catch (e) {}
    })();
  </script>

  <!-- Footer translation -->
  <script>
    function setHomeFooter() {
      var el = document.getElementById("footerText");

      if (el && window.walajna_language) {
        el.textContent = walajna_language.t(
          "home.footer",
          {
            year: new Date().getFullYear()
          }
        );
      }
    }

    document.addEventListener(
      "DOMContentLoaded",
      setHomeFooter
    );

    document.addEventListener(
      "walajna:i18n-applied",
      setHomeFooter
    );
  </script>



  <!-- Smooth scrolling for homepage sections -->
  <script>
    (function () {

      function scrollToHash() {
        var id = (location.hash || "")
          .replace(/^#/, "");

        if (!id) return;

        var el = document.getElementById(id);

        if (el) {
          el.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        }
      }

      document.addEventListener(
        "DOMContentLoaded",
        scrollToHash
      );

      window.addEventListener(
        "hashchange",
        scrollToHash
      );

    })();
  </script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var buttons = document.querySelectorAll(".how-switch__btn");
    var panels = document.querySelectorAll(".how-steps");

    if (!buttons.length || !panels.length) return;

    buttons.forEach(function (button) {
      button.addEventListener("click", function () {
        var target = button.getAttribute("data-how-target");

        buttons.forEach(function (btn) {
          var isActive = btn === button;

          btn.classList.toggle("is-active", isActive);
          btn.setAttribute(
            "aria-selected",
            isActive ? "true" : "false"
          );
        });

        panels.forEach(function (panel) {
          var shouldShow =
            panel.getAttribute("data-how-panel") === target;

          panel.hidden = !shouldShow;
        });
      });
    });
  });
</script>
