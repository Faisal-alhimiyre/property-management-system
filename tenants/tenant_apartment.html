<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل الشقة - ولجنا</title>

  <link rel="stylesheet" href="../css/navstyle.css">
  <link rel="stylesheet" href="../css/tenant-apart.css">

</head>
<!-- Request Type Modal -->
<div id="requestModal" class="wl-modal" aria-hidden="true">
  <div class="wl-modal__backdrop" data-close="true"></div>

  <div class="wl-modal__panel" role="dialog" aria-modal="true" aria-labelledby="requestModalTitle">
    <div class="wl-modal__header">
      <div>
        <h3 id="requestModalTitle" class="wl-modal__title">اختر نوع التواصل</h3>
        <p class="wl-modal__subtitle">سيتم إرسال الطلب للمالك مع لون يوضح نوعه</p>
      </div>

      <button id="closeRequestModal" class="wl-icon-btn" type="button" aria-label="إغلاق">✕</button>
    </div>

    <div class="wl-modal__body">    
      <div id="requestTypeList" class="wl-list" role="listbox" aria-label="أنواع الطلبات">
        <!-- Items injected by JS -->
      </div>

      <!-- ✅ Message box MUST be inside the modal -->
      <div id="requestMessageBox" class="wl-message-box" style="display:none;">
        <label class="wl-label" for="requestMessage">اكتب تفاصيل الطلب</label>

        <textarea
          id="requestMessage"
          maxlength="150"
          placeholder="اكتب وصف المشكلة أو الطلب (حد أقصى 150 حرف)"
        ></textarea>

        <div class="wl-char-counter">
          <span id="charCount">0</span>/150
        </div>

        <button id="submitRequestBtn" class="wl-btn wl-btn--primary" type="button">
          إرسال الطلب
        </button>
      </div>
    </div>

    <div class="wl-modal__footer">
      <button id="cancelRequestModal" class="wl-btn wl-btn--ghost" type="button">إلغاء</button>
    </div>
  </div>
</div>
<body data-nav="user">

  <div id="navbar-container"></div>

  <main class="apartment-details-wrap">
    <div class="header">
      <h2 id="aptTitle">تفاصيل الشقة</h2>
    </div>

    <section class="details-card">
      <div class="details-grid">
        <div class="item">
          <span class="label">رقم الشقة</span>
          <span class="value" id="aptNumber">—</span>
        </div>
        <div class="item">
          <span class="label">اسم العمارة</span>
          <span class="value" id="buildingName">—</span>
        </div>
        <div class="item">
          <span class="label">الحالة</span>
          <span class="value" id="leaseStatus">—</span>
        </div>
        <div class="item">
          <span class="label">الإيجار الشهري</span>
          <span class="value" id="rentAmount">—</span>
        </div>
      </div>
    </section>

    <section class="details-card">
      <h3 class="section-title">معلومات إضافية</h3>
      <div class="details-grid">
        <div class="item">
          <span class="label">تاريخ بداية العقد</span>
          <span class="value" id="startDate">—</span>
        </div>
        <div class="item">
          <span class="label">تاريخ نهاية العقد</span>
          <span class="value" id="endDate">—</span>
        </div>
        <div class="item">
          <span class="label">رقم العداد</span>
          <span class="value" id="meterNumber">—</span>
        </div>
        <div class="item">
          <span class="label">ملاحظات</span>
          <span class="value" id="notes">—</span>
        </div>
      </div>
    </section>

  <section class="actions">
  <button id="openRequestModal" class="action-btn">طلب صيانة</button>
  <button id="paymentsBtn" class="action-btn">عرض المدفوعات</button>
  <button class="action-btn ">عرض الوثائق  </button>
  </section>
  </main>

  <script src="../js/nav.js"></script>
  <script src="../js/apartment-details.js"></script>

</body>
</html>
