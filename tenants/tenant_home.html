<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <script>(function(){try{var l=localStorage.getItem('walajna_language')||'ar';if(l!=='en'&&l!=='ar'&&l!=='ur')l='ar';document.documentElement.setAttribute('lang',l==='en'?'en':(l==='ur'?'ur':'ar'));document.documentElement.setAttribute('dir',l==='en'?'ltr':'rtl');}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="meta.tenantHome"></title>

  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/navstyle.css">
  <link rel="stylesheet" href="../css/tenant-home.css">
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
</head>

<body data-nav="user" data-wl-bc="tenant-units">

  <div id="navbar-container"></div>

  <section class="page-title">
    <h2 data-i18n="tenant.unitsTitle"></h2>
  </section>

  <section class="buildings-grid">
    <div id="tenantPaymentAlerts" class="tenant-alerts-wrap"></div>
  </section>

  <section class="buildings-grid tenant-topbar-wrap">
    <div class="tenant-topbar">
      <div class="tenant-search-box">
        <input id="tenantApartmentSearch" type="text" data-i18n-placeholder="tenant.home.searchPh" placeholder="">
      </div>
      <div class="tenant-filter-box">
        <select id="tenantApartmentFilter">
          <option value="all" data-i18n-label="tenant.home.filterAll"></option>
          <option value="replied" data-i18n-label="tenant.home.filterReplied"></option>
          <option value="overdue" data-i18n-label="tenant.home.filterOverdue"></option>
          <option value="pinned" data-i18n-label="tenant.home.filterPinned"></option>
        </select>
      </div>
    </div>
    <div id="tenantUnitsStats" class="tenant-units-stats"></div>
  </section>

  <section class="buildings-grid">
    <div class="buildings-grid" id="tenantApartments"></div>
  </section>

  <script src="../js/main/breadcrumbs.js"></script>
  <script src="../js/main/auth.js"></script>
  <script src="../js/main/nav.js"></script>
  <script src="../js/tenant-manager/tenant-home.js"></script>
  <script src="../js/main/theme.js"></script>
</body>

</html>
