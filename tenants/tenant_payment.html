<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المدفوعات - ولجنا</title>

  <link rel="stylesheet" href="../css/navstyle.css">
  <link rel="stylesheet" href="../css/tenant-payments.css">
</head>
<body data-nav="user">

  <div id="navbar-container"></div>

  <main class="pay-wrap">
    <div class="pay-header">
      <div>
        <h2 id="pageTitle">سجل المدفوعات</h2>
        <p id="pageSub">عرض تاريخ المدفوعات للشقة</p>
      </div>

      <div class="pay-search">
        <input id="searchInput" type="text" placeholder="ابحث (مثال: فبراير، تحويل، 1500)" />
      </div>
    </div>

    <section class="pay-summary">
      <div class="sum-card">
        <span class="sum-label">إجمالي المدفوع</span>
        <span id="totalPaid" class="sum-value">—</span>
      </div>

      <div class="sum-card">
        <span class="sum-label">عدد العمليات</span>
        <span id="totalCount" class="sum-value">—</span>
      </div>

      <div class="sum-card">
        <span class="sum-label">الحالة</span>
        <span id="statusHint" class="sum-value">—</span>
      </div>
    </section>

    <section id="paymentsList" class="pay-list">
      <!-- Cards injected by JS -->
    </section>

    <p id="emptyState" class="empty" style="display:none;">لا توجد مدفوعات لهذه الشقة.</p>
  </main>

  <script src="../js/nav.js"></script>
  <script src="../js/tenant-payments.js"></script>
</body>
</html>
