<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل دخول - ولجنا</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../css/login.css" />
</head>

<body>
 <div  id="loginForm"> 

  <div class="login-bg"></div>
  <!-- Logo (top-right) -->
  <a href="owner_home.html" class="logo" aria-label="الشعار">
    <img src="../pics/logo.png" alt="ALAJNA" class="brand-logo">
  </a>

  <!-- Login form -->
 <!-- داخل <main class="login-wrap"> -->
<main class="login-wrap">
  <form class="login-form" id="loginForm">
    <div class="row">
      <label for="username">اسم المستخدم</label>
      <input id="username" type="text" required />
    </div>

    <div class="row">
      <label for="password">كلمة المرور</label>
      <input id="password" type="password" required />
    </div>

    <p class="error" id="loginError" aria-live="polite"></p>

    <button class="login-btn" type="submit">تسجيل الدخول</button>

    <a class="forgot-link" href="../auth/forgetpass.html">نسيت كلمة المرور؟</a>

    <p class="footer">
      ليس لديك حساب؟ <a href="../auth/register.html">إنشاء حساب</a>
    </p>
  </form>
</main>

<script src="../js/login.js"></script>
 </div>
</body>
</html>
