<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";document.documentElement.setAttribute("lang",l==="en"?"en":"ar");document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.loginTitle"></title>

  <!-- CSS -->
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/login.css" />
  <script src="../js/main/walajna-i18n.js"></script>
</head>

<body data-global-back="false">
 <div  id="loginForm"> 

  <div class="login-bg"></div>
  <!-- Logo (top-right) -->
  <a href="../owners/owner_home.html" class="logo" data-i18n-aria-label="common.logo" aria-label="">
    <img src="../pics/logo.png" alt="ALAJNA" class="brand-logo">
  </a>

  <!-- Login form -->
<main class="login-wrap">
  <form class="login-form" id="loginForm">
    <div class="row">
      <label for="username" data-i18n="auth.username"></label>
      <input id="username" type="text" required />
    </div>

    <div class="row">
      <label for="password" data-i18n="auth.password"></label>
      <input id="password" type="password" required />
    </div>

    <p class="error" id="loginError" aria-live="polite"></p>

    <button class="login-btn" type="submit" data-i18n="auth.loginBtn"></button>

    <a class="forgot-link" href="../auth/forgetpass.html" data-i18n="auth.forgotPassword"></a>

    <p class="footer">
      <span data-i18n="auth.noAccount"></span> <a href="../auth/register.html" data-i18n="auth.createAccount"></a>
    </p>
  </form>
</main>

<script src="../js/main/auth.js"></script>
<script src="../js/main/theme.js"></script>
<script src="../js/main/login.js"></script>
 </div>
</body>
</html>
