<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.verifyTitle"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/register.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
</head>
<body>
  <script src="../js/main/theme.js"></script>
  <div class="register-bg"></div>

  <a href="../auth/login.html" class="logo logo--corner" data-i18n-aria-label="common.logo" aria-label="">
    <img src="../pics/logo.png" class="brand-logo" data-i18n-alt="common.logo" alt="" />
  </a>

  <main class="register-wrap">
    <form class="register-form" id="codeForm">
      <h2 class="title" data-i18n="verify.title"></h2>

      <div class="row">
        <label for="code" data-i18n="verify.codeLabel"></label>
        <input
          id="code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          pattern="[0-9]{6}"
          minlength="6"
          maxlength="6"
          dir="ltr"
          required
        />
      </div>

      <p id="codeMessage" class="error"></p>

      <button class="register-btn" type="submit" data-i18n="verify.submit"></button>

      <p class="footer">
        <a href="../auth/login.html" data-i18n="auth.backToLogin"></a>
      </p>
    </form>
  </main>

  <script src="../js/main/global-back.js"></script>
  <script src="../js/main/verify-code.js"></script>
</body>
</html>
