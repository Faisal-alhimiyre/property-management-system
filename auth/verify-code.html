<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.verifyTitle"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/register.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
  <script src="../js/main/walajna-dialog.js"></script>
</head>
<body class="auth-page" data-global-back="false">
  <script src="../js/main/theme.js"></script>
  <div class="register-bg" aria-hidden="true"></div>

  <main class="register-wrap auth-shell">
    <div class="auth-stack">
  
      <a href="/" class="auth-logo-top" data-i18n-aria-label="common.logo" aria-label="">
        <img src="../pics/logo.png" class="auth-hero-logo" data-i18n-alt="common.logo" alt="" />
      </a>
  
      <div class="auth-card">
        <header class="auth-card__head">
          <h1 class="auth-card__title" data-i18n="verify.title"></h1>
          <p class="auth-card__sub" data-i18n="verify.sub"></p>
        </header>

        <form class="register-form" id="codeForm">
          <div class="row auth-field">
            <label for="code" data-i18n="verify.codeLabel"></label>
            <input
              id="code"
              class="auth-code-input"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]{6}"
              minlength="6"
              maxlength="6"
              dir="ltr"
              required
            />
          </div>

          <p id="codeMessage" class="error" aria-live="polite"></p>

          <button class="register-btn" type="submit" data-i18n="verify.submit"></button>

          <p class="footer">
            <a href="../auth/login.html" data-i18n="auth.backToLogin"></a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/main/auth.js"></script>
  <script src="../js/main/verify-code.js"></script>
</body>
</html>
