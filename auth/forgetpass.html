<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استعادة كلمة المرور - ولجنا</title>
  <link rel="stylesheet" href="../css/register.css" />
</head>
<body>

  <div class="register-bg"></div>

  <a href="../auth/login.html" class="logo">
    <img src="../pics/logo.png" class="brand-logo" alt="Walajna Logo" />
  </a>

  <main class="register-wrap">
    <form class="register-form" id="forgotForm">
      <h2 class="title">استعادة كلمة المرور</h2>

      <div class="recover-switch">
        <button type="button" class="recover-tab active" data-method="email">
          البريد الإلكتروني
        </button>

        <button type="button" class="recover-tab" data-method="phone">
          رقم الجوال
        </button>
      </div>

      <div class="row">
        <label for="identifier" id="identifierLabel">البريد الإلكتروني</label>
        <input
          id="identifier"
          type="email"
          placeholder="ادخل البريد الإلكتروني"
          autocomplete="email"
          required
        />
      </div>

      <p id="forgotMessage" class="error"></p>

      <button class="register-btn" type="submit">متابعة</button>

      <p class="footer">
        <a href="../auth/login.html">رجوع لتسجيل الدخول</a>
      </p>
    </form>
  </main>

  <script src="../js/main/forgetpass.js"></script>
</body>
</html>
