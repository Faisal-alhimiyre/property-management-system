<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.registerTitle"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/register.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
  <script src="../js/main/walajna-dialog.js"></script>
</head>

<body class="auth-page" data-global-back="false">
  <script src="../js/main/theme.js"></script>
  <div class="register-bg" aria-hidden="true"></div>

  <main class="register-wrap auth-shell">
    <div class="auth-stack auth-stack--wide">
      <div class="auth-card auth-card--wide">
  
        <a href="/" class="auth-card__brand" data-i18n-aria-label="common.logo" aria-label="">
          <img src="../pics/logo.png" alt="ALAJNA" class="auth-card__logo" />
        </a>
  
        <header class="auth-card__head">
          <h1 class="auth-card__title" data-i18n="auth.registerTitle"></h1>
          <p class="auth-card__sub" data-i18n="auth.registerSub"></p>
        </header>

        <form class="register-form" id="registerForm">
          <div class="register-grid">
            <div class="register-name-row register-grid__full">
              <div class="row auth-field">
                <label for="firstName" data-i18n="auth.firstName"></label>
                <input
                  id="firstName"
                  name="firstName"
                  type="text"
                  autocomplete="given-name"
                  required
                />
              </div>

              <div class="row auth-field">
                <label for="fatherName" data-i18n="auth.fatherName"></label>
                <input
                  id="fatherName"
                  name="fatherName"
                  type="text"
                  autocomplete="additional-name"
                  required
                />
              </div>

              <div class="row auth-field">
                <label for="familyName" data-i18n="auth.familyName"></label>
                <input
                  id="familyName"
                  name="familyName"
                  type="text"
                  autocomplete="family-name"
                  required
                />
              </div>
            </div>

            <div class="row auth-field register-grid__full">
              <label for="phoneNumber" data-i18n="auth.phone"></label>
              <input
                id="phoneNumber"
                name="phoneNumber"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                required
              />
            </div>

            <div class="row auth-field register-grid__full">
              <label for="email" data-i18n="auth.email"></label>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </div>

            <div class="row auth-field register-grid__full">
              <label for="nationalId" data-i18n="auth.nationalId"></label>
              <input
                id="nationalId"
                name="nationalId"
                type="text"
                inputmode="numeric"
                maxlength="10"
                autocomplete="off"
                required
              />
            </div>

            <div class="row auth-field register-grid__full">
              <label for="password" data-i18n="auth.password"></label>
              <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required />
              <ul class="password-reqs" id="passwordReqs" data-password-reqs="password" hidden></ul>
            </div>

            <div class="row auth-field register-grid__full">
              <label for="confirmPassword" data-i18n="auth.confirmPassword"></label>
              <input id="confirmPassword" name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required />
            </div>
          </div>

          <p class="error" id="errorBox" aria-live="polite"></p>

          <button class="register-btn" type="submit" data-i18n="auth.registerSubmit"></button>

          <p class="footer">
            <span data-i18n="auth.hasAccount"></span>
            <a href="../auth/login.html" data-i18n="auth.loginBtn"></a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/main/auth.js"></script>
  <script src="../js/main/saudi-national-id.js"></script>
  <script src="../js/main/password-policy.js"></script>
  <script src="../js/main/password-toggle.js"></script>
  <script src="../js/main/register.js"></script>
</body>
</html>
