<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اختيار الواجهة - ولجنا</title>

  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/register.css">
</head>

<body>

<div class="register-bg"></div>

<a href="../auth/login.html" class="logo logo-center" aria-label="الشعار">
  <img src="../pics/logo.png" alt="Walajna" class="choose-logo">
</a>

<main class="choose-wrap">
  <div class="choose-actions">

    <button class="choose-btn owner" onclick="chooseRole('owner')">
      مالك
    </button>

    <button class="choose-btn tenant" onclick="chooseRole('tenant')">
      مستأجر
    </button>

  </div>
</main>

<script src="../js/main/auth.js"></script>
<script src="../js/main/theme.js"></script>
<script>
requireAuth();

const currentUser = JSON.parse(localStorage.getItem("walajna_current_user"));
let users = JSON.parse(localStorage.getItem("walajna_users") || "[]");

if(!currentUser){
  window.location.href = "../auth/login.html";
}

function saveUser(updatedUser){

  users = users.map(user => {
    if(user.nationalId === updatedUser.nationalId){
      return updatedUser;
    }
    return user;
  });

  localStorage.setItem("walajna_users", JSON.stringify(users));
  localStorage.setItem("walajna_current_user", JSON.stringify(updatedUser));
}

function chooseRole(role){

  let roles = currentUser.roles || [];

  // إذا المستخدم لا يملك الدور يتم إضافته
  if(!roles.includes(role)){
    roles.push(role);
  }

  const updatedUser = {
    ...currentUser,
    roles
  };

  saveUser(updatedUser);

  // حفظ الدور النشط
  localStorage.setItem("activeRole", role);

  // التوجيه حسب الدور
  if(role === "owner"){
    window.location.href = "../owners/owner_home.html";
  }

  if(role === "tenant"){
    window.location.href = "../tenants/tenant_home.html";
  }

}

</script>

</body>
</html>
