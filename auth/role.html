<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.roleChoose"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/register.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
</head>
<body class="auth-page" data-global-back="false">
  <script src="../js/main/theme.js"></script>
  <div class="register-bg" aria-hidden="true"></div>

  <main class="choose-wrap auth-shell">
    <div class="auth-stack">
      <a href="../auth/login.html" class="auth-logo-top" data-i18n-aria-label="common.logo" aria-label="">
        <img src="../pics/logo.png" data-i18n-alt="meta.app" alt="" class="auth-hero-logo" />
      </a>
      <div class="auth-card auth-card--role">
        <p class="role-card__lead" data-i18n="role.choosePrompt"></p>
        <p class="role-card__sub" data-i18n="role.pageSub"></p>
        <div class="choose-actions">
          <button type="button" class="choose-btn owner" data-role="owner" data-i18n="role.chooseOwner"></button>
          <button type="button" class="choose-btn tenant" data-role="tenant" data-i18n="role.chooseTenant"></button>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/main/auth.js"></script>
  <script>
    (async function () {
      await WalajnaAuth.hydrateSession();
      requireAuth();

      let currentUser = WalajnaAuth.getCurrentUser();
      if (!currentUser) {
        window.location.href = "../auth/login.html";
        return;
      }

      async function chooseRole(role) {
        const API = WalajnaAuth.API_BASE || "http://127.0.0.1:8002";
        try {
          const r = await WalajnaAuth.fetchWithAuth(`${API}/users/me`, {
            method: "PUT",
            body: JSON.stringify({ active_role: role }),
          });
          if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            const msg =
              (err && err.detail) ||
              (typeof WalajnaAuth !== "undefined" && window.walajna_language && window.walajna_language.t("login.network")) ||
              "Could not save role";
            alert(typeof msg === "string" ? msg : JSON.stringify(msg));
            return;
          }
          const updated = await r.json();
          WalajnaAuth.setSession({ user: updated });
          currentUser = WalajnaAuth.getCurrentUser();
        } catch {
          alert(
            (typeof WalajnaAuth !== "undefined" && window.walajna_language && window.walajna_language.t("login.network")) ||
              "Network error"
          );
          return;
        }
        try {
          const ar =
            (currentUser && (currentUser.active_role || currentUser.activeRole)) || role;
          sessionStorage.setItem("activeRole", ar);
          localStorage.setItem("activeRole", ar);
        } catch {
          /* ignore */
        }
        if (role === "owner") window.location.href = "../owners/owner_home.html";
        if (role === "tenant") window.location.href = "../tenants/tenant_home.html";
      }

      window.chooseRole = chooseRole;

      document.querySelectorAll("[data-role]").forEach((btn) => {
        btn.addEventListener("click", () => chooseRole(btn.getAttribute("data-role")));
      });
    })();
  </script>
</body>
</html>
