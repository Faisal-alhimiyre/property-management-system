<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";document.documentElement.setAttribute("lang",l==="en"?"en":"ar");document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.roleChoose"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/register.css" />
  <script src="../js/main/walajna-i18n.js"></script>
</head>
<body data-global-back="false">
  <script src="../js/main/theme.js"></script>
  <div class="register-bg"></div>

  <a href="../auth/login.html" class="logo logo-center" data-i18n-aria-label="common.logo" aria-label="">
    <img src="../pics/logo.png" data-i18n-alt="meta.app" alt="" class="choose-logo" />
  </a>

  <main class="choose-wrap">
    <div class="choose-actions">
      <button type="button" class="choose-btn owner" data-role="owner" data-i18n="role.chooseOwner"></button>
      <button type="button" class="choose-btn tenant" data-role="tenant" data-i18n="role.chooseTenant"></button>
    </div>
  </main>

  <script src="../js/main/auth.js"></script>
  <script>
    (async function () {
      await WalajnaAuth.hydrateSession();
      requireAuth();

      let currentUser = WalajnaAuth.getCurrentUser();
      if (!currentUser) {
        window.location.href = "../auth/login.html";
        return;
      }

      function chooseRole(role) {
        const roles = Array.isArray(currentUser.roles) ? [...currentUser.roles] : [];
        if (!roles.includes(role)) roles.push(role);
        const updatedUser = { ...currentUser, roles };
        WalajnaAuth.setSession({ user: updatedUser });
        try {
          sessionStorage.setItem("activeRole", role);
          localStorage.setItem("activeRole", role);
        } catch {
          /* ignore */
        }
        currentUser = updatedUser;
        if (role === "owner") window.location.href = "../owners/owner_home.html";
        if (role === "tenant") window.location.href = "../tenants/tenant_home.html";
      }

      window.chooseRole = chooseRole;

      document.querySelectorAll("[data-role]").forEach((btn) => {
        btn.addEventListener("click", () => chooseRole(btn.getAttribute("data-role")));
      });
    })();
  </script>
</body>
</html>
