<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اختيار الواجهة - ولجنا</title>

  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/register.css">
</head>

<body>

<div class="register-bg"></div>

<a href="../auth/login.html" class="logo logo-center" aria-label="الشعار">
  <img src="../pics/logo.png" alt="Walajna" class="choose-logo">
</a>

<main class="choose-wrap">
  <div class="choose-actions">

    <button class="choose-btn owner" onclick="chooseRole('owner')">
      مالك
    </button>

    <button class="choose-btn tenant" onclick="chooseRole('tenant')">
      مستأجر
    </button>

  </div>
</main>

<script src="../js/main/auth.js"></script>
<script src="../js/main/theme.js"></script>
<script>
(function () {
  let currentUser = null;

  async function boot() {
    await WalajnaAuth.hydrateSession();
    requireAuth();
    currentUser = WalajnaAuth.getCurrentUser();
    if (!currentUser) {
      window.location.href = "../auth/login.html";
      return;
    }

    window.chooseRole = function (role) {
      const roles = Array.isArray(currentUser.roles) ? [...currentUser.roles] : [];
      if (!roles.includes(role)) {
        roles.push(role);
      }
      const updatedUser = { ...currentUser, roles };
      WalajnaAuth.setSession({ user: updatedUser });
      sessionStorage.setItem("activeRole", role);
      currentUser = updatedUser;
      if (role === "owner") {
        window.location.href = "../owners/owner_home.html";
      }
      if (role === "tenant") {
        window.location.href = "../tenants/tenant_home.html";
      }
    };
  }

  void boot();
})();
</script>

</body>
</html>
