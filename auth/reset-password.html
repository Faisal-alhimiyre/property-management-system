<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.resetTitle"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/register.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
</head>
<body>
  <script src="../js/main/theme.js"></script>
  <div class="register-bg"></div>

  <a href="../auth/login.html" class="logo logo--corner" data-i18n-aria-label="common.logo" aria-label="">
    <img src="../pics/logo.png" class="brand-logo" data-i18n-alt="common.logo" alt="" />
  </a>

  <main class="register-wrap">
    <form class="register-form" id="resetForm">
      <h2 class="title" data-i18n="reset.title"></h2>

      <div class="row">
        <label for="newPassword" data-i18n="settings.newPassword"></label>
        <input
          id="newPassword"
          type="password"
          data-i18n-placeholder="reset.newPwdPh"
          placeholder=""
          autocomplete="new-password"
          required
        />
      </div>

      <div class="row">
        <label for="confirmPassword" data-i18n="auth.confirmPassword"></label>
        <input
          id="confirmPassword"
          type="password"
          data-i18n-placeholder="reset.confirmPh"
          placeholder=""
          autocomplete="new-password"
          required
        />
      </div>

      <p id="resetMessage" class="error"></p>

      <button class="register-btn" type="submit" data-i18n="reset.saveBtn"></button>

      <p class="footer">
        <a href="../auth/login.html" data-i18n="auth.backToLogin"></a>
      </p>
    </form>
  </main>

  <script src="../js/main/global-back.js"></script>
  <script src="../js/main/reset-password.js"></script>
</body>
</html>
