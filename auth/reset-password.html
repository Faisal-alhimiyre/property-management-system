<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>(function(){try{var l=localStorage.getItem("walajna_language")||"ar";if(l!=="en"&&l!=="ar"&&l!=="ur")l="ar";document.documentElement.setAttribute("lang",l==="en"?"en":(l==="ur"?"ur":"ar"));document.documentElement.setAttribute("dir",l==="en"?"ltr":"rtl");}catch(e){}})();</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="meta.resetTitle"></title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/register.css" />
  <script src="../js/main/walajna-i18n-ur.js"></script>
  <script src="../js/main/walajna-i18n.js"></script>
  <script src="../js/main/walajna-dialog.js"></script>
</head>
<body class="auth-page" data-global-back="false">
  <script src="../js/main/theme.js"></script>
  <div class="register-bg" aria-hidden="true"></div>

  <main class="register-wrap auth-shell">
    <div class="auth-stack">
      <a href="../auth/login.html" class="auth-logo-top" data-i18n-aria-label="common.logo" aria-label="">
        <img src="../pics/logo.png" class="auth-hero-logo" data-i18n-alt="common.logo" alt="" />
      </a>

      <div class="auth-card">
        <header class="auth-card__head">
          <h1 class="auth-card__title" data-i18n="reset.title"></h1>
          <p class="auth-card__sub" data-i18n="reset.sub"></p>
        </header>

        <form class="register-form" id="resetForm">
          <div class="row auth-field">
            <label for="newPassword" data-i18n="settings.newPassword"></label>
            <input
              id="newPassword"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
            <ul class="password-reqs" id="passwordReqs" data-password-reqs="newPassword" hidden></ul>
          </div>

          <div class="row auth-field">
            <label for="confirmPassword" data-i18n="auth.confirmPassword"></label>
            <input
              id="confirmPassword"
              type="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </div>

          <p id="resetMessage" class="error" aria-live="polite"></p>

          <button class="register-btn" type="submit" data-i18n="reset.saveBtn"></button>

          <p class="footer">
            <a href="../auth/login.html" data-i18n="auth.backToLogin"></a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/main/auth.js"></script>
  <script src="../js/main/password-policy.js"></script>
  <script src="../js/main/password-toggle.js"></script>
  <script src="../js/main/reset-password.js"></script>
</body>
</html>
