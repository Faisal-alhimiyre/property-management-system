<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إعادة تعيين كلمة المرور - ولجنا</title>
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/register.css" />
</head>
<body>

  <div class="register-bg"></div>

  <a href="../auth/login.html" class="logo">
    <img src="../pics/logo.png" class="brand-logo" alt="Walajna Logo" />
  </a>

  <main class="register-wrap">
    <form class="register-form" id="resetForm">
      <h2 class="title">إعادة تعيين كلمة المرور</h2>

      <div class="row">
        <label for="newPassword">كلمة المرور الجديدة</label>
        <input
          id="newPassword"
          type="password"
          placeholder="ادخل كلمة المرور الجديدة"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="row">
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <input
          id="confirmPassword"
          type="password"
          placeholder="أعد إدخال كلمة المرور"
          autocomplete="new-password"
          required
        />
      </div>

      <p id="resetMessage" class="error"></p>

      <button class="register-btn" type="submit">حفظ كلمة المرور</button>

      <p class="footer">
        <a href="../auth/login.html">رجوع لتسجيل الدخول</a>
      </p>
    </form>
  </main>

  <script src="../js/main/theme.js"></script>
  <script src="../js/main/reset-password.js"></script>
</body>
</html>
